@if(userActive){
    <!-- Modern Floating Profile Card aligned seamlessly to the top navigation area -->
    <div class="fixed top-3 right-80 z-50 flex items-center gap-3 bg-black/20 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/10">
        <p class="text-sm font-medium text-white flex items-center gap-1">
            <span>👋</span> Welcome, <span class="font-bold text-yellow-300">{{userActive}}</span>
        </p>
        <span class="text-white/30 text-xs">|</span>
        <a (click)="logout()" class="text-xs font-bold text-red-200 hover:text-red-100 hover:bg-red-500/20 px-2.5 py-1 rounded-full cursor-pointer transition-all duration-150 tracking-wide uppercase">Logout</a>
    </div>
}
 
<div class="mt-23 max-w-7xl bg-gradient-to-br from-white to-gray-50 mx-auto rounded-2xl shadow-xl p-8 border border-gray-100 clear-both">
  
    <div class="grid md:grid-cols-2 gap-8">
    <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <table class="w-full border-collapse rounded-xl overflow-hidden shadow-sm">
        <thead class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-sm">
            <tr>
                <th class="px-6 py-4 text-center font-semibold uppercase text-xs tracking-wider border-b border-purple-500 w-16">#</th>
                <th class="px-6 py-4 text-left font-semibold uppercase text-xs tracking-wider border-b border-purple-500">title:</th>
                <th class="px-6 py-4 text-left font-semibold uppercase text-xs tracking-wider border-b border-purple-500">Description:</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            @for(post of allPosts | paginate:{
                totalItems:totalRecords,
                itemsPerPage:5,
                currentPage:startLinkIndex
            }; track post.id){
            <tr class="hover:bg-purple-50/50 transition-colors duration-200 group">
                <td class="px-6 py-4 text-center">
                     <input type="radio" name="r1" (change)="showPost(post.id)" class="w-5 h-5 text-purple-600 border-gray-300 focus:ring-purple-500 cursor-pointer accent-purple-600 transition-transform group-hover:scale-110">
                </td>
                <td class="px-6 py-4 font-semibold text-gray-800 group-hover:text-purple-700 transition-colors duration-200">{{post.title}}</td>
                <td class="px-6 py-4 text-gray-600 text-sm leading-relaxed max-w-xs truncate">{{post.description}}</td>
            </tr>
        }
        </tbody>
      </table>
      <div class="mt-8 text-center bg-gray-50 py-3 rounded-lg border border-gray-100">
      <!--Adding Pagination Controls-->
      <pagination-controls
    (pageChange)="startLinkIndex = $event">
</pagination-controls>
</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
           <form (submit)="onSubmit($event)" class="space-y-6">
            <header class="mb-2 text-transparent bg-clip-text bg-gradient-to-r from-gray-800 to-gray-600 font-extrabold text-4xl tracking-tight">
                <h2>Add Post !</h2>
            </header>
            <hr class="border border-gray-100 my-4"/>
            <div>
            <label class="mb-2 block font-semibold text-sm uppercase tracking-wider text-gray-700">Title :</label>
            <input type="text" [(ngModel)]="myModel.title" name="title" required class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent hover:border-gray-400 hover:shadow transition-all duration-200 text-gray-800">
            </div>
            <div>
                <label class="mb-2 block font-semibold text-sm uppercase tracking-wider text-gray-700">Description:</label>
                <textarea name="desc" id="desc" [(ngModel)]="myModel.desc" required cols="30" rows="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent hover:border-gray-400 hover:shadow transition-all duration-200 text-gray-800 leading-relaxed"></textarea>
            </div>   
            <div class="flex items-center gap-4 pt-4 border-t border-gray-50">
                @if(!updateDeleteBtnVisible){
                <button class="bg-gradient-to-r from-blue-700 to-blue-800 text-white font-medium px-8 py-3 rounded-lg shadow-md hover:from-blue-600 hover:to-blue-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150">Add</button>
                <span class="text-gray-300 font-light text-xl">|</span>
                <button class="bg-gradient-to-r from-red-700 to-red-800 text-white font-medium px-8 py-3 rounded-lg shadow-md hover:from-red-600 hover:to-red-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150" type="reset">Reset</button>
                }@else{
                <button class="bg-gradient-to-r from-blue-700 to-blue-800 text-white font-medium px-8 py-3 rounded-lg shadow-md hover:from-blue-600 hover:to-blue-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150" type="button" (click)="updatePost()">Update</button>
                <span class="text-gray-300 font-light text-xl">|</span>
                <button class="bg-gradient-to-r from-red-700 to-red-800 text-white font-medium px-8 py-3 rounded-lg shadow-md hover:from-red-600 hover:to-red-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150" type="button" (click)="deletePost()">Delete</button>
                }
            </div>
        </form>
    </div>
    </div>  
     
</div>
