<div class="mt-24 max-w-7xl mx-auto bg-gradient-to-br from-white to-gray-50 p-8 shadow-2xl shadow-blue-500/20 rounded-2xl border border-gray-100">
     <div class="grid md:grid-cols-2 gap-12">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <header class="block mb-2 font-extrabold text-3xl text-transparent bg-clip-text bg-gradient-to-r from-gray-800 to-gray-600 tracking-tight">
                <h4>SignUP:</h4>
            </header>
            <hr class="border border-gray-100 my-2 shadow-none"/>
            <form (submit)="onSignup($event)" class="mt-8 space-y-5">
            <div class="grid-cols-2 grid gap-5">
                <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">FirstName :</label>
                    <input type="text" [(ngModel)]="myUser.firstName" name="fname" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400" >
                </div>
                <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">LastName :</label>
                    <input type="text" name="lname" [(ngModel)]="myUser.lastName" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
                </div>
            </div>

            <div>
                <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">Email :</label>
                <input type="email" name="email" required [(ngModel)]="myUser.email" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
            </div>
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">Password :</label>
                    <input type="password" name="pass1" [(ngModel)]="myUser.pass1" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
                </div>
                <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">Confirm Password:</label>
                    <input type="password" name="pass2" [(ngModel)]="myUser.pass2" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
                </div>
            </div>
            <div class="mt-8 pt-4 flex items-center justify-center gap-4 border-t border-gray-50">
                   <button class="bg-gradient-to-r from-emerald-500 to-green-600 text-white font-medium px-8 py-2.5 rounded-lg shadow-md hover:from-emerald-600 hover:to-green-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150">Submit</button>
                   <span class="text-gray-300 font-light text-xl">|</span>
                   <button class="bg-gradient-to-r from-rose-500 to-red-600 text-white font-medium px-8 py-2.5 rounded-lg shadow-md hover:from-rose-600 hover:to-red-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150"  type="reset">Reset</button>
            </div>
        </form>
        </div>
        
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
              <div>
                  <header class="block mb-2 font-extrabold text-3xl text-transparent bg-clip-text bg-gradient-to-r from-gray-800 to-gray-600 tracking-tight">
                    <h4>SignIN:</h4>
                  </header>
                   <hr class="border border-gray-100 my-2 shadow-none"/>
                   <form (submit)="onLogin($event)" class="mt-8 space-y-5">
                   <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">Email:</label>
                    <input type="email" [(ngModel)]="loginUser.email" name="email2" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
                  </div>
                  <div>
                    <label class="mb-1.5 block font-semibold text-sm uppercase tracking-wider text-gray-700">Password:</label>
                    <input type="password" [(ngModel)]="loginUser.pass1" name="passw" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400">
                  </div>
                  <div class="mt-8 pt-4 flex items-center justify-center border-t border-gray-50">
                    <button class="w-full md:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium px-12 py-2.5 rounded-lg shadow-md hover:from-blue-700 hover:to-indigo-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150" type="submit">Login</button>
                  </div>
                  </form>
              </div>
        </div>
     </div>
</div>
