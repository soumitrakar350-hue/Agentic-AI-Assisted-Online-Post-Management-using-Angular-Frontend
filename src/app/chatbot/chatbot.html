<div class="mt-20 max-w-4xl mx-auto bg-gradient-to-br from-white to-gray-50 p-8 shadow-2xl shadow-gray-200/80 rounded-2xl border border-gray-100">
    <header class="text-transparent bg-clip-text bg-gradient-to-r from-gray-900 to-gray-700 font-extrabold block mb-2 text-3xl tracking-tight">
        <h4>Post ChatBot Automation:</h4>
    </header>
    <hr class="border border-gray-100 mt-4 mb-6 shadow-none"/>
    <form (submit)="askAI($event)" class="space-y-6">
          <div>
            <label class="mb-2 block text-gray-700 font-semibold text-sm uppercase tracking-wider">Prompt :</label>
            <textarea name="prompt" id="prompt" required cols="30" rows="8" class="w-full px-4 py-3.5 border border-gray-300 shadow-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200 text-gray-800 placeholder-gray-400 bg-white leading-relaxed font-mono text-sm" placeholder="Prompt Hint: 1.Add new Post 2.Update Post 3.Delete Post 4.Search Posts"></textarea>
          </div>
          <div class="text-center pt-2">
            <button class="w-full sm:w-auto bg-gradient-to-r from-red-500 to-red-600 text-white font-medium px-10 py-3 rounded-xl shadow-md hover:from-red-600 hover:to-red-700 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 transform transition-all duration-150 tracking-wide">Submit</button>
          </div>
    </form>
</div>
